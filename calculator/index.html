<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="result" disabled/>
      <div class="buttons">
        <button onclick="clearResult()" class="clear">C</button>
        <button onclick="appendNumber('()')" class="kurung">()</button>
        <button onclick="appendOperator('%')"class="kurung">%</button>
        <button onclick="appendOperator('/')"class="kurung">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button onclick="appendOperator('*')"class="kurung">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button onclick="appendOperator('-')"class="kurung">-</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendOperator('+')"class="kurung">+</button>

        <button onclick="toggleSign()" class="function">+/-</button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button onclick="calculateResult()" class="aqual">=</button>
      </div>
    </div>
    <script>
  let resultInput = document.getElementById("result");

  function appendNumber(num) {
    resultInput.value += num;
  }

  function appendOperator(op) {
    resultInput.value += op;
  }

  function clearResult() {
    resultInput.value = "";
  }

  function calculateResult() {
    try {
      resultInput.value = eval(resultInput.value);
    } catch {
      resultInput.value = "Error";
    }
  }

  function toggleSign() {
    if (resultInput.value) {
      resultInput.value = String(-1 * parseFloat(resultInput.value));
    }
  }

  function appendParenthesis() {
    let lastChar = resultInput.value.slice(-1);
    if (
      (resultInput.value.match(/\(/g) || []).length >
      (resultInput.value.match(/\)/g) || []).length
    ) {
      resultInput.value += ")";
    } else {
      resultInput.value += "(";
    }
  }
  function appendParenthesis() {
  let current = resultInput.value;
  const openCount = (current.match(/\(/g) || []).length;
  const closeCount = (current.match(/\)/g) || []).length;

  // Tambahkan ( jika belum seimbang, atau baru mulai
  if (openCount === closeCount || current.endsWith('(')) {
    resultInput.value += '(';
  } else {
    resultInput.value += ')';
  }
}

</script>


  </body>
</html>
